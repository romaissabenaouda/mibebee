<title>Para Luna 💕</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #d7cfc5;
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .escena {
    position: relative;
    width: min(92vw, 640px);
    aspect-ratio: 516 / 363;
    cursor: pointer;
  }
  .escena img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%; object-fit: fill;
    transition: opacity 1s ease, transform 1.2s ease;
  }
  /* Antes de abrir: se ve el sobre */
  #sobre { opacity: 1; z-index: 2; }
  #carta { opacity: 0; transform: translateY(40px) scale(0.85); z-index: 1; }

  /* Despues de abrir: el sobre baja y se va, sale la carta */
  .escena.abierta #sobre { opacity: 0; transform: translateY(60px); }
  .escena.abierta #carta { opacity: 1; transform: translateY(0) scale(1); }

  .pista { margin-top: 24px; color: #8c241c; font-size: 18px; transition: opacity 0.5s; }
  .pista.oculta { opacity: 0; }
</style>
